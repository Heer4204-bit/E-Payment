<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumCore - Semiconductor & Digital Logic Simulator</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #060a12;
            --panel-bg: rgba(11, 20, 38, 0.75);
            --border-color: rgba(30, 60, 110, 0.5);
            --border-glow: rgba(0, 210, 255, 0.3);
            --text-primary: #e1f1ff;
            --text-secondary: #6482ad;
            --accent-cyan: #00f0ff;
            --accent-blue: #0072ff;
            --accent-green: #00ff88;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 114, 255, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.05), transparent 50%);
        }

        /* Glassmorphism Panel Style */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .panel-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chip-icon-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            padding: 0.5rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
            50% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.6); }
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-text {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-green);
            line-height: 1;
        }

        .status-sub {
            font-size: 0.6rem;
            color: var(--text-secondary);
        }

        nav {
            display: flex;
            gap: 1rem;
            background: rgba(15, 28, 48, 0.6);
            padding: 0.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        nav button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        nav button:hover, nav button.active {
            color: #fff;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Views management */
        .tab-view {
            display: none;
            width: 100%;
        }

        .tab-view.active {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            gap: 1.25rem;
            flex-grow: 1;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Controls Panel */
        .control-group {
            margin-bottom: 1rem;
        }

        .control-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .control-desc {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* Toggle Switches */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a2942;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #6482ad;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(0, 240, 255, 0.2);
            border-color: var(--accent-cyan);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        /* Select Input */
        select {
            width: 100%;
            background: #0f1c30;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .gate-info {
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* Range Slider */
        input[type=range] {
            width: 100%;
            margin: 0.5rem 0;
            accent-color: var(--accent-cyan);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.5rem;
            background: rgba(15, 28, 48, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-primary {
            background: rgba(0, 114, 255, 0.2);
            border-color: var(--accent-blue);
        }

        /* Circuit Panel & Canvas */
        .circuit-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, rgba(11, 25, 48, 0.8) 0%, rgba(6, 10, 18, 0.95) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .circuit-canvas {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .circuit-canvas::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 0;
        }

        .input-nodes, .output-nodes {
            display: flex;
            flex-direction: column;
            gap: 3rem;
            z-index: 2;
        }

        .node-box {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background: #091322;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            transition: all 0.3s;
        }

        .node-box.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .node-label {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--text-secondary);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        /* Dynamic Chip Visual */
        .chip-container {
            width: 130px;
            height: 130px;
            background: #0d1520;
            border: 2px solid #2a4365;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            transition: all 0.3s;
        }

        .chip-container.output-active {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .chip-pins-left, .chip-pins-right {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 70%;
        }
        .chip-pins-left { left: -8px; }
        .chip-pins-right { right: -8px; }

        .pin {
            width: 8px;
            height: 6px;
            background: #4a5568;
            border-radius: 2px;
        }

        .chip-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-cyan);
            letter-spacing: 1px;
        }

        .chip-subtitle {
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* SVG Wires & Flow Animation */
        .wires-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .wire {
            fill: none;
            stroke: rgba(30, 60, 110, 0.6);
            stroke-width: 3;
            stroke-dasharray: 6;
            transition: all 0.3s;
        }

        .wire.active {
            stroke: var(--accent-cyan);
            animation: dash 0.8s linear infinite;
            filter: drop-shadow(0 0 6px var(--accent-cyan));
        }

        @keyframes dash {
            to { stroke-dashoffset: -12; }
        }

        .circuit-footer-tags {
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Signal Flow Engine Screen Overlay */
        .signal-engine-status {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* Metrics & Telemetry Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .metric-card {
            background: rgba(15, 28, 48, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .metric-icon {
            color: var(--accent-cyan);
        }

        .metric-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-name {
            font-size: 0.65rem;
            color: var(--text-secondary);
        }

        /* Telemetry Log */
        .telemetry-log {
            background: #030712;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .log-entry { color: var(--text-secondary); line-height: 1.2; }
        .log-entry.system { color: #4b6b94; }
        .log-entry.action { color: var(--accent-cyan); }
        .log-entry.output { color: var(--accent-green); }

        /* Learn View Library */
        .learn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .learn-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .learn-card h3 {
            color: var(--accent-cyan);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .truth-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            font-size: 0.8rem;
        }

        .truth-table th, .truth-table td {
            border: 1px solid var(--border-color);
            padding: 0.4rem;
            text-align: center;
        }

        .truth-table th {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            padding-top: 0.5rem;
        }

        .about-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }

        .about-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .quote {
            font-size: 0.75rem;
            font-style: italic;
            color: var(--text-secondary);
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-logo">
            <!-- QuantumCore Semiconductor Symbol -->
            <div class="chip-icon-badge">
                <i data-lucide="cpu" style="width: 28px; height: 28px; color: var(--accent-cyan);"></i>
            </div>
            <div>
                <h1 class="brand-title">QuantumCore</h1>
                <p class="brand-subtitle">Semiconductor & Digital Logic Simulator</p>
            </div>
        </div>

        <div class="header-right">
            <div class="status-badge">
                <div class="status-dot"></div>
                <div>
                    <div class="status-text">LIVE ENGINE ACTIVE</div>
                    <div class="status-sub">All Systems Operational</div>
                </div>
            </div>

            <!-- Working Navigation Options -->
            <nav>
                <button id="navBuild" class="active" onclick="switchTab('build')">BUILD</button>
                <button id="navSimulate" onclick="switchTab('simulate')">SIMULATE</button>
                <button id="navLearn" onclick="switchTab('learn')">LEARN</button>
            </nav>
        </div>
    </header>

    <!-- TAB 1: BUILD VIEW (MAIN DASHBOARD) -->
    <div id="viewBuild" class="tab-view active">
        <div class="dashboard-grid">
            
            <!-- Left Column Controls -->
            <div class="column">
                <div class="panel">
                    <div class="panel-header">
                        <i data-lucide="binary" class="metric-icon" style="width:16px; height:16px;"></i>
                        <span class="panel-title">Digital Logic Gates</span>
                    </div>
                    <div class="panel-subtitle">Control input signals and select logic gate</div>

                    <div class="control-group">
                        <div class="control-label-row">
                            <div>
                                <div class="control-label">Input A</div>
                                <div class="control-desc">Primary Signal Source</div>
                            </div>
                            <label class="switch">
                                <input type="checkbox" id="inputA" checked onchange="updateSimulation()">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="control-group">
